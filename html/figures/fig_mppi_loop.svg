<text x="324" y="226" font-size="11.5" fill="#586273" text-anchor="middle">障害物を通るとコストが大きい</text>
<circle cx="246" cy="146" r="5" fill="#1f2733" stroke="none" stroke-width="1.5"/>
<rect x="436" y="50" width="200" height="186" rx="10" fill="#fafbfc" stroke="#c8ced8" stroke-width="1.2"/>
<text x="536" y="24" font-size="14" fill="#1f2733" font-weight="700" text-anchor="middle">③ 重みをつける</text>
<text x="536" y="42" font-size="11.5" fill="#586273" text-anchor="middle">w<tspan dy="3" font-size="9">k</tspan><tspan dy="-3"> ∝ exp(−(S</tspan><tspan dy="3" font-size="9">k</tspan><tspan dy="-3"> − S</tspan><tspan dy="3" font-size="9">min</tspan><tspan dy="-3">) / λ)</tspan></text>
