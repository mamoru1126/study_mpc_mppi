<text x="586" y="226" font-size="11" fill="#586273" text-anchor="middle">14</text>
<rect x="602" y="209.5" width="16" height="1.2" fill="#eb6834" opacity="0.25"/>
<text x="610" y="226" font-size="11" fill="#586273" text-anchor="middle">23</text>
<line x1="452" y1="210" x2="624" y2="210" stroke="#1f2733" stroke-width="1"/>
<text x="454" y="70" font-size="11" fill="#586273" text-anchor="start">重み</text>
<text x="622" y="70" font-size="11" fill="#eb6834" text-anchor="end">S が小さいほど重い</text>
<rect x="648" y="50" width="200" height="186" rx="10" fill="#fafbfc" stroke="#c8ced8" stroke-width="1.2"/>
<text x="748" y="24" font-size="14" fill="#1f2733" font-weight="700" text-anchor="middle">④ 平均する</text>
<text x="748" y="42" font-size="11.5" fill="#586273" text-anchor="middle">重みつき平均で案を更新</text>
