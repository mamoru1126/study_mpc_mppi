<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 354" width="900" height="354" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="receding horizon。毎周期 N ステップ先まで入力列を計画し、最初の 1 手だけ実行して、残りを 1 つずらして次の周期の出発点にする">
<title>receding horizon。毎周期 N ステップ先まで入力列を計画し、最初の 1 手だけ実行して、残りを 1 つずらして次の周期の出発点にする</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker>
<marker id="ah-mpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="ah-mppi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="ah-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker>
</defs>
<rect width="900" height="354" fill="#ffffff"/>
<path d="M 150 50 V 44 H 538 V 50" fill="none" stroke="#1f2733" stroke-width="1.2"/>
<text x="344" y="36" font-size="12.5" fill="#1f2733" text-anchor="middle">ホライズン：N ステップ先まで計画する（図は N = 6）</text>
<text x="20" y="74" font-size="13" fill="#1f2733" font-weight="700" text-anchor="start">周期 0</text>
<text x="20" y="92" font-size="11" fill="#586273" text-anchor="start">(時刻 t で解く)</text>
<rect x="150" y="59" width="58" height="34" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="179" y="80" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">u<tspan dy="4" font-size="10">0</tspan></text>
<text x="179" y="108" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="middle">実行</text>
<rect x="216" y="59" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="245" y="80" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">1</tspan></text>
<line x1="245" y1="95" x2="245" y2="124" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="282" y="59" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="311" y="80" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">2</tspan></text>
<line x1="311" y1="95" x2="311" y2="124" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="348" y="59" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="377" y="80" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">3</tspan></text>
<line x1="377" y1="95" x2="377" y2="124" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="414" y="59" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="443" y="80" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">4</tspan></text>
<line x1="443" y1="95" x2="443" y2="124" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="480" y="59" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="509" y="80" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">5</tspan></text>
<line x1="509" y1="95" x2="509" y2="124" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<text x="20" y="142" font-size="13" fill="#1f2733" font-weight="700" text-anchor="start">周期 1</text>
<text x="20" y="160" font-size="11" fill="#586273" text-anchor="start">(時刻 t+1 で解く)</text>
<rect x="216" y="127" width="58" height="34" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="245" y="148" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">u<tspan dy="4" font-size="10">0</tspan></text>
<text x="245" y="176" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="middle">実行</text>
<rect x="282" y="127" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="311" y="148" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">1</tspan></text>
<line x1="311" y1="163" x2="311" y2="192" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="348" y="127" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="377" y="148" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">2</tspan></text>
<line x1="377" y1="163" x2="377" y2="192" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="414" y="127" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="443" y="148" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">3</tspan></text>
<line x1="443" y1="163" x2="443" y2="192" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="480" y="127" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="509" y="148" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">4</tspan></text>
<line x1="509" y1="163" x2="509" y2="192" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<rect x="546" y="127" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="575" y="148" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">5</tspan></text>
<line x1="575" y1="163" x2="575" y2="192" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<text x="20" y="210" font-size="13" fill="#1f2733" font-weight="700" text-anchor="start">周期 2</text>
<text x="20" y="228" font-size="11" fill="#586273" text-anchor="start">(時刻 t+2 で解く)</text>
<rect x="282" y="195" width="58" height="34" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="311" y="216" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">u<tspan dy="4" font-size="10">0</tspan></text>
<text x="311" y="244" font-size="11" fill="#2a78d6" font-weight="700" text-anchor="middle">実行</text>
<rect x="348" y="195" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="377" y="216" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">1</tspan></text>
<rect x="414" y="195" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="443" y="216" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">2</tspan></text>
<rect x="480" y="195" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="509" y="216" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">3</tspan></text>
<rect x="546" y="195" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2"/>
<text x="575" y="216" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">4</tspan></text>
<rect x="612" y="195" width="58" height="34" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="641" y="216" font-size="15" fill="#2a78d6" text-anchor="middle">u<tspan dy="4" font-size="10">5</tspan></text>
<rect x="712" y="62" width="14" height="14" rx="3" fill="#2a78d6"/>
<text x="734" y="74" font-size="12.5" fill="#1f2733" text-anchor="start">濃い箱（最初の 1 手）だけ</text>
<text x="734" y="94" font-size="12.5" fill="#1f2733" text-anchor="start">実行する</text>
<line x1="719" y1="112" x2="719" y2="136" stroke="#8a93a3" stroke-width="1.2" marker-end="url(#ah-muted)"/>
<text x="734" y="124" font-size="12.5" fill="#1f2733" text-anchor="start">残りは 1 つずらして</text>
<text x="734" y="144" font-size="12.5" fill="#1f2733" text-anchor="start">次の周期の出発点に</text>
<text x="734" y="164" font-size="12.5" fill="#586273" text-anchor="start">（ウォームスタート）</text>
<rect x="712" y="196" width="14" height="14" rx="3" fill="#eaf2fc" stroke="#2a78d6" stroke-dasharray="3 2"/>
<text x="734" y="208" font-size="12.5" fill="#1f2733" text-anchor="start">点線の箱：ずらして空いた</text>
<text x="734" y="228" font-size="12.5" fill="#1f2733" text-anchor="start">最後の 1 ステップ（前の値</text>
<text x="734" y="248" font-size="12.5" fill="#1f2733" text-anchor="start">をコピーして埋める）</text>
<text x="20" y="264" font-size="12.5" fill="#1f2733" font-weight="700" text-anchor="start">実際に実行される入力 = 各周期の u<tspan dy="4" font-size="10">0</tspan><tspan dy="-4"> をつないだもの</tspan></text>
<rect x="150" y="273" width="58" height="34" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="179" y="295" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">周期 0</text>
<rect x="216" y="273" width="58" height="34" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="245" y="295" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">周期 1</text>
<rect x="282" y="273" width="58" height="34" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/>
<text x="311" y="295" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">周期 2</text>
<text x="360" y="295" font-size="16" fill="#2a78d6" font-weight="700" text-anchor="start">…</text>
<line x1="150" y1="324" x2="690" y2="324" stroke="#c8ced8" stroke-width="1.2"/>
<line x1="179" y1="320" x2="179" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="179" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t</text>
<line x1="245" y1="320" x2="245" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="245" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+1</text>
<line x1="311" y1="320" x2="311" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="311" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+2</text>
<line x1="377" y1="320" x2="377" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="377" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+3</text>
<line x1="443" y1="320" x2="443" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="443" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+4</text>
<line x1="509" y1="320" x2="509" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="509" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+5</text>
<line x1="575" y1="320" x2="575" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="575" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+6</text>
<line x1="641" y1="320" x2="641" y2="328" stroke="#c8ced8" stroke-width="1.2"/>
<text x="641" y="344" font-size="11.5" fill="#586273" text-anchor="middle">t+7</text>
<text x="698" y="328" font-size="11.5" fill="#586273" text-anchor="start">時刻</text>
</svg>
