<text x="514" y="226" font-size="11" fill="#586273" text-anchor="middle">9</text>
<rect x="530" y="78" width="16" height="132" fill="#eb6834" opacity="1.00"/>
<text x="538" y="226" font-size="11" fill="#586273" text-anchor="middle">6</text>
