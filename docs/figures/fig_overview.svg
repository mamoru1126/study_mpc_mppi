<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="MPC と MPPI の全体像。同じ最適制御問題を、MPC は微分で、MPPI はサンプリングで解き、最初の 1 手だけ実行して毎周期くり返す">
<title>MPC と MPPI の全体像。同じ最適制御問題を、MPC は微分で、MPPI はサンプリングで解き、最初の 1 手だけ実行して毎周期くり返す</title>
<defs>
<marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2733"/></marker>
<marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker>
<marker id="ah-mpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="ah-mppi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
<marker id="ah-opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker>
</defs>
<rect width="840" height="480" fill="#ffffff"/>
<rect x="150" y="16" width="540" height="96" rx="10" fill="#f4f6f9" stroke="#c8ced8" stroke-width="1.2"/>
<text x="420" y="44" font-size="16" fill="#1f2733" font-weight="700" text-anchor="middle">共通の問題：有限ホライズン最適制御問題</text>
<text x="420" y="70" font-size="13" fill="#586273" text-anchor="middle">今の状態から N ステップ先までの入力列を選び、コストの合計を最小にする</text>
<text x="420" y="94" font-size="12.5" fill="#586273" text-anchor="middle">コスト = 目標からのずれ ＋ 入力の大きさ ＋ 障害物への近さ</text>
<line x1="330" y1="114" x2="232" y2="150" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#ah-mpc)"/>
<line x1="510" y1="114" x2="608" y2="150" stroke="#eb6834" stroke-width="1.8" marker-end="url(#ah-mppi)"/>
<text x="250" y="128" font-size="12.5" fill="#2a78d6" text-anchor="end">微分して解く</text>
<text x="590" y="128" font-size="12.5" fill="#eb6834" text-anchor="start">試して解く</text>
<rect x="24" y="152" width="380" height="200" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="44" y="184" font-size="16" fill="#2a78d6" font-weight="700" text-anchor="start">MPC（勾配を使う）</text>
<path d="M 300 170 Q 342 236 384 170" fill="none" stroke="#1f2733" stroke-width="1.4"/>
<line x1="296.9" y1="166.4" x2="325.9" y2="205.6" stroke="#2a78d6" stroke-width="1.3"/>
<circle cx="305.9" cy="178.6" r="3.6" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<circle cx="322.7" cy="196" r="3.6" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<circle cx="336.1" cy="202.4" r="3.6" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="44" y="218" font-size="13" fill="#1f2733" text-anchor="start">傾き（微分）を計算して、コストが下がる</text>
<text x="44" y="240" font-size="13" fill="#1f2733" text-anchor="start">向きへ入力列を直す。これを数回くり返す</text>
<text x="44" y="266" font-size="12.5" fill="#586273" text-anchor="start">道具：ガウス・ニュートン法・SQP（02〜04 章）</text>
<text x="44" y="296" font-size="13" fill="#1f2733" text-anchor="start">◎ 少ない計算で正確に求まる。制約を守れる</text>
<text x="44" y="322" font-size="13" fill="#1f2733" text-anchor="start">× 微分できないコストと局所解に弱い</text>
<rect x="436" y="152" width="380" height="200" rx="12" fill="#fdf0e9" stroke="#eb6834" stroke-width="1.5"/>
<text x="456" y="184" font-size="16" fill="#eb6834" font-weight="700" text-anchor="start">MPPI（サンプリングを使う）</text>
<path d="M 716 188 Q 756 188 800 166" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="0.45"/>
<path d="M 716 188 Q 756 188 800 177" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="0.45"/>
<path d="M 716 188 Q 756 188 800 188" fill="none" stroke="#eb6834" stroke-width="2.4" opacity="1.0"/>
<path d="M 716 188 Q 756 188 800 199" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="0.45"/>
<path d="M 716 188 Q 756 188 800 210" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="0.45"/>
<circle cx="716" cy="188" r="4" fill="#1f2733" stroke="none" stroke-width="1.5"/>
<text x="456" y="218" font-size="13" fill="#1f2733" text-anchor="start">ゆらぎを足した入力列を K 本試し、コストが</text>
<text x="456" y="240" font-size="13" fill="#1f2733" text-anchor="start">低いものほど重くして平均する</text>
<text x="456" y="266" font-size="12.5" fill="#586273" text-anchor="start">道具：重み ∝ exp(−コスト / λ)（05・06 章）</text>
<text x="456" y="296" font-size="13" fill="#1f2733" text-anchor="start">◎ 微分がいらない。どんなコストでも使える</text>
<text x="456" y="322" font-size="13" fill="#1f2733" text-anchor="start">× たくさん試す必要がある。出力がガタつく</text>
<line x1="214" y1="352" x2="296" y2="392" stroke="#8a93a3" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<line x1="626" y1="352" x2="544" y2="392" stroke="#8a93a3" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<rect x="150" y="394" width="540" height="72" rx="10" fill="#f4f6f9" stroke="#c8ced8" stroke-width="1.2"/>
<text x="420" y="424" font-size="14.5" fill="#1f2733" font-weight="700" text-anchor="middle">最初の 1 手だけ実行し、状態を測り直して、また解く</text>
<text x="420" y="450" font-size="12.5" fill="#586273" text-anchor="middle">receding horizon。前回の答えを 1 ステップずらして出発点にする</text>
<path d="M 690 430 H 826 V 64 H 692" fill="none" stroke="#8a93a3" stroke-width="1.6" marker-end="url(#ah-muted)"/>
<text x="758" y="422" font-size="12" fill="#586273" text-anchor="middle">毎周期くり返す</text>
</svg>
