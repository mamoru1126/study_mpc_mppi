<line x1="213" y1="143" x2="223" y2="143" stroke="#8a93a3" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<line x1="425" y1="143" x2="435" y2="143" stroke="#8a93a3" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<line x1="637" y1="143" x2="647" y2="143" stroke="#8a93a3" stroke-width="1.4" marker-end="url(#ah-muted)"/>
<text x="430" y="266" font-size="13" fill="#1f2733" text-anchor="middle">→ 最初の 1 手だけ実行し、案を 1 つずらして次の周期へ（01 章と同じ）</text>
