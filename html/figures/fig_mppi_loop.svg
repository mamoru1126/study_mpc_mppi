<path d="M 670 146 Q 740 146 808 72" fill="none" stroke="#eb6834" stroke-width="1.0" opacity="0.15"/>
<path d="M 670 146 Q 740 146 808 96" fill="none" stroke="#eb6834" stroke-width="1.0" opacity="0.15"/>
