<path d="M 670 146 Q 740 146 808 166" fill="none" stroke="#eb6834" stroke-width="1.0" opacity="0.46"/>
<path d="M 670 146 Q 740 146 808 184" fill="none" stroke="#eb6834" stroke-width="1.0" opacity="0.19"/>
<path d="M 670 146 Q 740 146 808 200" fill="none" stroke="#eb6834" stroke-width="1.0" opacity="0.15"/>
